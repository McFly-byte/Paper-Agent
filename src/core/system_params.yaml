# 系统参数配置文件

SAVE_DIR: "data"
# 知识库配置
KB_TYPE: "chroma"
# RAG：写作阶段检索后端（环境变量 RAG_BACKEND 可覆盖）
rag:
  backend: llamaindex
  llamaindex:
    enable: true
    top_k: 5
    query_mode: hyde
    # HyDE 仅对 multi-query 子任务中的第一条执行，降低延迟与成本（关闭 multi_query 时行为与单路一致）
    hyde_primary_only: true
    enable_rerank: true
    # 两阶段检索：0 表示按 top_k 自动放大召回（上限见代码）
    recall_top_k: 0
    rerank:
      # tfidf_fuse | cross_encoder | cohere | voyage | none
      mode: tfidf_fuse
      fuse_alpha: 0.7
      cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2
      cohere_model: rerank-multilingual-v3.0
      voyage_model: rerank-2
      # 亦可设环境变量 COHERE_API_KEY / VOYAGE_API_KEY
      cohere_api_key: ""
      voyage_api_key: ""
    multi_query:
      # true 时在服务端再规划 3~5 条互补子查询（一次 LLM）；与 retrieval_agent 列表互补
      enabled: true
      max_queries: 6
    section_intent:
      # 根据当前写作小节文案推断 section_type 偏好；soft=重排加分，hard=先宽松过滤再补全
      enabled: true
      # keywords：规则；llm：轻量 Chat 分类（见 models.yaml rag-section-intent-model）
      classifier: keywords
      llm_client_type: rag-section-intent-model
      filter_mode: soft
      boost: 0.12
    enable_metadata_filters: true
    use_semantic_splitter: true
    chunk_size: 512
    chunk_overlap: 64
enable_reranker: True
tmpdb_top_k: 2
tmpdb_similarity_threshold: 0.05
top_k: 5
similarity_threshold: 0.05

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/app.log
  max_bytes: 10485760
  backup_count: 5

# 缓存配置
cache:
  enabled: true
  type: memory
  ttl: 3600
  max_size: 1000

# 请求配置
request:
  timeout: 30
  max_retries: 3
  retry_delay: 1

# 并发配置
concurrency:
  max_workers: 4
  max_connections: 10

# 远端 LLM（如硅基流动）RPM/TPM 限流：双令牌桶 + 可配置并发，降低 429
# 默认按控制台常见额度：RPM=1000、TPM=40000；safety_factor 预留余量
# 百炼等：按桶名独立 RPM/TPM（与全局 llm_remote_rate_limit 并存；路由见 models.yaml llm-routing）
llm_rate_limit_buckets:
  enabled: true
  buckets:
    bailian_qwen36plus:
      requests_per_minute: 30000
      requests_per_minute_env: BAILIAN_QWEN36PLUS_RPM
      tokens_per_minute: 5000000
      tokens_per_minute_env: BAILIAN_QWEN36PLUS_TPM
      safety_factor: 0.85
    bailian_qwen35flash:
      requests_per_minute: 30000
      requests_per_minute_env: BAILIAN_QWEN35FLASH_RPM
      tokens_per_minute: 5000000
      tokens_per_minute_env: BAILIAN_QWEN35FLASH_TPM
      safety_factor: 0.85
    bailian_batch:
      requests_per_minute: 600
      tokens_per_minute: 2000000
      safety_factor: 0.85

# Batch Chat 默认最小等待超时（秒）；可被各 ``*-model.request_timeout`` 覆盖
llm_batch_chat:
  default_timeout_seconds: 1800

# 可选并发池上限（未设置时仍用 llm_remote_rate_limit.max_concurrent_*）
llm_concurrency_pools:
  realtime_high_priority_max: 6
  realtime_low_priority_max: 8
  batch_offline_max: 4

# 主流程五节点确定性门禁（与 src/core/node_gates.py 对齐，可按环境调参）
node_gates:
  search_max_results: 500
  search_min_results: 3
  search_min_dedup_ratio: 0.75
  search_min_avg_query_terms: 2.0
  search_max_query_chars: 180
  search_min_topic_overlap: 0.08
  reading_min_parse_ratio: 0.6
  reading_min_field_fill_ratio: 0.25
  reading_min_abstract_chars: 80
  reading_min_metadata_coverage: 0.8
  analyse_global_min_chars: 400
  analyse_global_min_module_hits: 4
  analyse_max_cluster_to_paper_ratio: 0.75
  analyse_min_cluster_size_balance: 0.12
  writing_min_section_chars: 200
  writing_min_section_match_ratio: 0.75
  writing_min_review_pass_rate: 0.5
  writing_min_evidence_hint_ratio: 0.5
  writing_min_title_content_match_ratio: 0.5
  writing_min_rag_positive_call_ratio: 0.5
  report_min_chars: 800
  report_min_section_coverage: 0.2
  report_min_heading_count: 2
  report_min_section_body_chars: 40
  report_max_duplicate_paragraph_ratio: 0.25
  # 报告与源章节重叠：字符 trigram 召回阈值（润色后子串常对不上，不宜过高）
  report_section_trigram_recall_min: 0.11
  report_section_overlap_max_chars: 1200

llm_remote_rate_limit:
  enabled: true
  apply_when_model_provider_in:
    - siliconflow
    - dashscope
  requests_per_minute: 1000
  tokens_per_minute: 40000
  # TPM 桶最大「瞬时容量」，须 ≥ 单次阅读预扣 token（reading_per_call_token_estimate_cap）
  token_bucket_max_burst_tokens: 120000
  # 略收紧有效 TPM，抵消「粗估偏乐观」与平台瞬时统计
  safety_factor: 0.75
  # 阅读 / 深度分析等「单次大请求」并发；写作见 max_concurrent_writing_sections
  max_concurrent_llm_tasks: 2
  # 篇级阅读上下文极大，默认串行，显著降低 TPM 叠加（可改为 2 若配额更高）
  max_concurrent_reading_tasks: 1
  # SelectorGroupChat 单章多轮多智能体，TPM 易打满，默认略保守
  max_concurrent_writing_sections: 2
  per_call_token_estimate_cap: 32000
  # 阅读：更高封顶 + 更保守的字符/token + 输出预留；仍 429 时可再降 max_concurrent_reading_tasks 或升 multiplier
  reading_per_call_token_estimate_cap: 72000
  reading_chars_per_token_divisor: 3
  reading_output_reserve_tokens: 10000
  reading_token_estimate_multiplier: 1.15
  reading_retry_stop_attempts: 12
  reading_retry_wait_max_seconds: 240
  reading_overhead_tokens: 5000
  deep_analyse_overhead_tokens: 4000
  # 单章全流程（多轮）粗估总 token，偏保守可减少 429
  writing_section_estimated_tokens: 50000
  cluster_theme_estimated_tokens: 6000
  embedding_overhead_per_call: 500

# 文件路径配置
paths:
  data_dir: data
  cache_dir: cache
  output_dir: output
  temp_dir: temp
  reports_dir: data/reports

# 性能配置
performance:
  batch_size: 10
  chunk_size: 1000
  enable_streaming: true

# 安全配置
security:
  enable_rate_limit: true
  rate_limit_per_minute: 60
  enable_cors: true
  allowed_origins: "*"

# LangSmith（必看）：LangGraph tracing + 丰富评估 (LLM-as-Judge, datasets, evaluation)
# 参考官网教程：https://langsmith.langchain.ac.cn/observability/how_to_guides/trace_with_langgraph
# 功能包括：
# - 完整工作流 traceable 追踪 (PaperAgent Full Workflow)
# - 分析质量、写作质量、报告完整性、RAG 检索 4 大维度 LLM Judge 评估
# - 自动生成 evaluation dataset，支持批量 offline eval
# - 在 LangSmith UI 可查看详细 trace tree、评分、反馈、趋势图
observability:
  langsmith:
    tracing: true
    project: "paper-agent"
    # 评估相关配置 (未来可扩展)
    enable_evaluation: true
    eval_dataset: "paper-agent-eval-dataset"
    # LangSmith SDK 离线 RAG 数据集评估（scripts/run_langsmith_rag_eval.py）
    # Dataset 仅有 Q/A；检索语料在本地 Chroma，请填 kb_xxx（见 data/knowledge_base_data/global_metadata.json）
    rag_eval_dataset: "RAG_test_LLMAPP"
    rag_eval_db_id: null
    rag_eval_top_k: 5
    rag_eval_similarity_threshold: 0.0
    # 本机 LLM 判分（feedback key: correctness_local），绕开 LangSmith 数据集上托管 Correctness 的 210s 限制；为 true 时请在 LangSmith 上移除或忽略云端 Correctness
    rag_eval_local_llm_correctness: false
    rag_eval_judge_max_chars: 2400
    rag_eval_judge_timeout: 180

# v2 工作流：计划驱动 / Trace（环境变量可覆盖，见 docs/refactor/MIGRATION_PLAN.md）
workflow_v2:
  auto_approve_plan: true
  enable_background_investigation: true
  enable_trace_events: true

# 各个模型提供商的API密钥和基础URL
# ollama:
#   # Ollama 对 key 不校验。勿用字面量 ollama，否则与下方顶级键 ollama 冲突导致 config 解析错误
#   api_key: sk-local-ollama
#   base_url: http://127.0.0.1:11434/v1
#   # 本地大模型流式「相邻 chunk 间隔」易超时；122B 多并发阅读时可再调大
#   request_timeout: 1800

siliconflow:
  api_key: SILICONFLOW_API_KEY
  base_url: https://api.siliconflow.cn/v1
  # 流式长输出 / 排队时避免 httpx ReadTimeout（默认非 ollama 已放宽，此处可覆盖）
  request_timeout: 600

openai:
  api_key: OPENAI_API_KEY
  base_url: https://api.openai.com/v1

dashscope:
  api_key: DASHSCOPE_API_KEY
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Batch Chat（OpenAI 兼容）：与实时不同 host，路径仍为 /chat/completions；可用环境变量 DASHSCOPE_BATCH_BASE_URL 覆盖
  batch_base_url: https://batch.dashscope.aliyuncs.com/compatible-mode/v1

ark:
  api_key: ARK_API_KEY
  base_url: https://ark.cn-beijing.volces.com/api/v3

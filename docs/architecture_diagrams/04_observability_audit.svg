<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFAFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#26344F" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#566C9F"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:42px;font-weight:800;fill:#202A43}
      .subtitle{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:20px;fill:#566077}
      .h{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:21px;font-weight:800;fill:#202A43}
      .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:15px;fill:#566077}
      .small{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:13px;fill:#68738A}
      .box{fill:#FFFFFF;stroke:#D5DAEA;stroke-width:2;filter:url(#shadow)}
      .layer{fill:#F2F5FF;stroke:#CCD4ED;stroke-width:2}
      .artifact{fill:#FFFFFF;stroke:#D9E1ED;stroke-width:2}
      .line{stroke:#566C9F;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#9BA9C7;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="72" y="82" class="title">可观测与可审计架构</text>
  <text x="74" y="118" class="subtitle">让比赛评审不仅看到“生成了报告”，还能看到“为什么可信、哪里有风险、如何复查”</text>

  <g transform="translate(90,175)">
    <rect class="layer" x="0" y="0" width="350" height="530" rx="28"/>
    <text x="28" y="44" class="h">运行时观测输入</text>
    <g transform="translate(35,80)">
      <rect class="box" x="0" y="0" width="280" height="80" rx="16"/>
      <text x="24" y="32" class="h">时间线事件</text>
      <text x="24" y="58" class="t">每个节点的开始、完成、失败和指标</text>
      <rect class="box" x="0" y="110" width="280" height="80" rx="16"/>
      <text x="24" y="142" class="h">边界检查</text>
      <text x="24" y="168" class="t">检索、阅读、分析、写作、报告质量门禁</text>
      <rect class="box" x="0" y="220" width="280" height="80" rx="16"/>
      <text x="24" y="252" class="h">临时运行状态</text>
      <text x="24" y="278" class="t">大对象外置，避免主状态膨胀</text>
      <rect class="box" x="0" y="330" width="280" height="80" rx="16"/>
      <text x="24" y="362" class="h">错误与告警</text>
      <text x="24" y="388" class="t">非致命 warning 不隐藏，严格模式可阻断</text>
    </g>
  </g>

  <g transform="translate(555,270)">
    <rect class="box" x="0" y="0" width="360" height="260" rx="30"/>
    <text x="180" y="52" text-anchor="middle" class="h">RunAuditExporter</text>
    <text x="180" y="88" text-anchor="middle" class="t">脱敏、截断、汇总、落盘</text>
    <text x="180" y="116" text-anchor="middle" class="t">把一次运行变成可复查证据包</text>
    <rect x="78" y="155" width="204" height="42" rx="21" fill="#EDF2FF" stroke="#C7D2EF"/>
    <text x="180" y="183" text-anchor="middle" class="t" font-weight="700">artifacts/run_audits</text>
  </g>

  <g transform="translate(1040,155)">
    <rect class="layer" x="0" y="0" width="465" height="605" rx="28"/>
    <text x="28" y="44" class="h">审计包核心产物</text>
    <g transform="translate(35,78)">
      <rect class="artifact" x="0" y="0" width="175" height="58" rx="14"/>
      <text x="87" y="36" text-anchor="middle" class="t">manifest 清单</text>
      <rect class="artifact" x="220" y="0" width="175" height="58" rx="14"/>
      <text x="307" y="36" text-anchor="middle" class="t">audit notes</text>
      <rect class="artifact" x="0" y="82" width="175" height="58" rx="14"/>
      <text x="87" y="118" text-anchor="middle" class="t">timeline</text>
      <rect class="artifact" x="220" y="82" width="175" height="58" rx="14"/>
      <text x="307" y="118" text-anchor="middle" class="t">boundary checks</text>
      <rect class="artifact" x="0" y="164" width="175" height="58" rx="14"/>
      <text x="87" y="200" text-anchor="middle" class="t">研究计划</text>
      <rect class="artifact" x="220" y="164" width="175" height="58" rx="14"/>
      <text x="307" y="200" text-anchor="middle" class="t">论文过滤报告</text>
      <rect class="artifact" x="0" y="246" width="175" height="58" rx="14"/>
      <text x="87" y="282" text-anchor="middle" class="t">阅读抽取摘要</text>
      <rect class="artifact" x="220" y="246" width="175" height="58" rx="14"/>
      <text x="307" y="282" text-anchor="middle" class="t">证据账本摘要</text>
      <rect class="artifact" x="0" y="328" width="175" height="58" rx="14"/>
      <text x="87" y="364" text-anchor="middle" class="t">引用映射</text>
      <rect class="artifact" x="220" y="328" width="175" height="58" rx="14"/>
      <text x="307" y="364" text-anchor="middle" class="t">计划覆盖报告</text>
      <rect class="artifact" x="0" y="410" width="175" height="58" rx="14"/>
      <text x="87" y="446" text-anchor="middle" class="t">忠实度审查</text>
      <rect class="artifact" x="220" y="410" width="175" height="58" rx="14"/>
      <text x="307" y="446" text-anchor="middle" class="t">终稿引用校验</text>
      <rect class="artifact" x="110" y="492" width="175" height="58" rx="14" fill="#FFF8EB"/>
      <text x="197" y="528" text-anchor="middle" class="t">最终报告</text>
    </g>
  </g>

  <path class="line" d="M440,330 C500,330 500,330 555,350"/>
  <path class="line" d="M440,438 C500,438 500,438 555,450"/>
  <path class="line" d="M915,400 C965,400 990,400 1040,400"/>

  <g transform="translate(165,770)">
    <rect class="box" x="0" y="0" width="1270" height="78" rx="22"/>
    <text x="34" y="32" class="h">比赛答辩价值</text>
    <text x="208" y="32" class="t">评审可以从审计包回放一次研究运行：计划是否合理、论文为何入选、证据是否存在、引用是否有效、报告哪里有 warning</text>
    <text x="208" y="58" class="t">这使系统从“能生成文本”升级为“能解释过程、能定位风险、能被人工复查”的研究型智能体应用</text>
  </g>

  <g transform="translate(555,565)">
    <rect x="0" y="0" width="360" height="105" rx="22" fill="#FFFFFF" stroke="#D5DAEA" stroke-width="2" filter="url(#shadow)"/>
    <text x="26" y="38" class="h">发布前分析器</text>
    <text x="26" y="66" class="t">检查缺文件、证据链断裂、过滤过宽、metadata 缺失</text>
  </g>
  <path class="dash" d="M735,530 C735,545 735,550 735,565"/>
</svg>
